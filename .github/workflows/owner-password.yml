# Modified for Railway owner-password authentication.
name: Owner password verification
on:
  workflow_dispatch:
  push:
    branches:
      - railway-owner-password
      - railway-owner-password-v0.7.0
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: multica_owner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MULTICA_OWNER_TEST_DATABASE_URL: postgres://postgres:local-ci-only@localhost:5432/multica_owner_test?sslmode=disable
      DATABASE_URL: postgres://postgres:local-ci-only@localhost:5432/multica_owner_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: server/go.sum
      - name: Apply real database migrations
        working-directory: server
        run: go run ./cmd/migrate up
      - name: Test owner bootstrap, login, and existing auth contracts
        working-directory: server
        run: |-
          go test -race -timeout 10m ./internal/ownerauth/... ./internal/migrations ./internal/middleware ./internal/auth ./internal/service ./cmd/server
          go test -race -timeout 10m ./internal/handler -run 'PasswordLogin|ConfigExposesLogin|EmailCodeStdout|WorkspaceDeletionManifest|Config|SendCode|VerifyCode|Auth'
      - name: Compile server
        working-directory: server
        run: go build ./cmd/server
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '@multica/web...'
      - name: Generate web content types
        run: pnpm --filter @multica/web mdx
      - name: Test shared login and authentication state
        run: pnpm --filter @multica/core --filter @multica/views --filter @multica/web test
      - name: Typecheck authentication consumers
        run: pnpm --filter @multica/core --filter @multica/views --filter @multica/web typecheck
  images:
    needs:
      - backend
      - frontend
    if: github.repository == 'hmseeb/multica-railway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: multica-backend
          - dockerfile: Dockerfile.web
            image: multica-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified owner-password image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:owner-${{ github.sha }}
          build-args: |-
            VERSION=v0.7.0-owner
            COMMIT=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=v0.7.0-owner
          cache-from: type=gha,scope=owner-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=owner-${{ matrix.image }}
